<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Llama Control Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { border: 0; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); width: 100%; max-width: 400px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-body p-4">
      <h4 class="card-title mb-1">Llama Control Center</h4>
      <p class="small-muted mb-4">Esta instancia está protegida por token. Ingresa el token definido en <span class="mono">LLAMA_WEB_TOKEN</span>.</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label">Token</label>
          <input type="password" name="token" class="form-control mono" autofocus required>
        </div>
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
