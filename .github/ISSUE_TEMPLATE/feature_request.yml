name: Propuesta de mejora
description: Nueva funcionalidad o mejora
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema que resuelve
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - UI / UX
        - API
        - Cola / worker
        - Modelos / perfiles
        - llama-server
        - Despliegue / CI
