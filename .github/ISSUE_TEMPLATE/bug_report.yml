name: Reporte de bug
description: La web, el worker o la gestión de modelos falla
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Revisa `docs/TROUBLESHOOTING.md` y adjunta logs de `docker compose`.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: dropdown
    id: componente
    attributes:
      label: Componente
      options:
        - Web / UI
        - API
        - Worker / Redis / RQ
        - Descubrimiento de binarios
        - Modelos / descargas
        - llama-server
        - Docker / CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / commit
      placeholder: "v1.0.0 o git rev-parse --short HEAD"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail=200 web worker` y `/health`."
      render: shell
