name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python 3.12
      - name: Instalar proyecto y dev
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python 3.12
      - name: Instalar proyecto y dev
        run: uv pip install -e ".[dev]"
      - name: Mypy
        run: .venv/bin/mypy app/ worker.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python ${{ matrix.python-version }}
      - name: Instalar proyecto y dev
        run: uv pip install -e ".[dev]"
      - name: Pytest con cobertura
        run: .venv/bin/pytest -q --cov=app --cov=worker --cov-report=term-missing:skip-covered --cov-fail-under=75

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - run: uv pip install pip-audit
      - run: .venv/bin/pip-audit --skip-editable

  docker:
    name: docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            target: web
            image: ghcr.io/${{ github.repository }}
          - name: worker
            target: worker
            image: ghcr.io/${{ github.repository }}-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
